name: ❯ Python audioanalyser

on:
  pull_request:
    branches:
      - main
      - "feat/*"
  push:
    branches:
      - main
      - "feat/*"

jobs:
  # This job reads the version number from setup.cfg and sets it as an
  # environment variable
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: ❯ Set up Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Needs the checkout: this job reads setup.cfg.
      - uses: actions/checkout@v4
      - name: ❯ Get version number from setup.cfg
        id: set-version
        run: |
          version=$(python -c 'import configparser; cfg = configparser.ConfigParser(); cfg.read("setup.cfg"); print(cfg.get("metadata", "version"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # This job runs unit tests using pytest
  pytest:
    needs: version
    runs-on: ubuntu-latest
    steps:
      # Check out the repository code
      - uses: actions/checkout@v4

      # Set up Python and install dependencies
      - name: ❯ Set up Python and install dependencies 🐍📦
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: ❯ Install dependencies 📦
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      # Coverage options come from [tool.pytest.ini_options] in pyproject.toml,
      # including --cov-fail-under, so the gate lives with the project config.
      - name: ❯ Run pytest 🧪
        run: pytest

  # This job runs flake8 to check for code style issues
  lint:
    needs: version
    runs-on: ubuntu-latest
    steps:
      # Check out the repository code
      - uses: actions/checkout@v4
      # Set up Python and install dependencies
      - name: ❯ Set up Python and install dependencies 🐍📦
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: ❯ Install flake8 📦
        run: python -m pip install flake8
      # Run flake8
      - name: ❯ Run flake8 🔍
        run: flake8

  # This job builds the distribution packages, and publishes them
  # to PyPI
  build:
    needs: [version, pytest]
    runs-on: ubuntu-latest
    env:
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      PKG_NAME: audioanalyser
    steps:
      # Check out the repository code
      - uses: actions/checkout@v4
      - name: ❯ Set up Python 🐍
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install dependencies
      - name: ❯ Install dependencies 📦
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      # Update the version number based on the setup.cfg file
      - name: Update version number from setup.cfg file 📝
        id: update-version
        run: |
          NEW_VERSION=$(grep -E '^version =' setup.cfg | cut -d '=' -f 2 | tr -d '[:space:]')
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
        shell: /bin/bash -e {0}

      # Generate the changelog based on git log and template file
      - name: Generate Changelog 📚
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Append version information to CHANGELOG.md
          echo "## Release v${{ env.VERSION }} - $(date +'%Y-%m-%d')" >> ${{ github.workspace }}/CHANGELOG.md
          # Copy content of template file to CHANGELOG.md
          cat TEMPLATE.md >> ${{ github.workspace }}/CHANGELOG.md
          # Append git log to CHANGELOG.md
          echo "$(git log --pretty=format:'%s' --reverse $(git describe --tags --abbrev=0)..HEAD)" >> ${{ github.workspace }}/CHANGELOG.md
          # Append empty line to CHANGELOG.md
          echo "" >> ${{ github.workspace }}/CHANGELOG.md

      # Build distribution packages
      - name: ❯ Build distribution packages 🧰
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python setup.py sdist bdist_wheel

      # Publish distribution packages to PyPI
      - name: ❯ Publish distribution packages to PyPI 🚀
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          user: ${{ env.TWINE_USERNAME }}
          password: ${{ env.TWINE_PASSWORD }}
          packages_dir: dist
          verify_metadata: true
          skip_existing: true

      # Append artifact links to the changelog
      - name: Append Artifact Links 🔗
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "" >> ${{ github.workspace }}/CHANGELOG.md
          echo "## Artifacts 🎁" >> ${{ github.workspace }}/CHANGELOG.md
          for filename in dist/*; do
            link="$(basename $filename)"
            echo "* [$link](${{ env.RELEASES_URL }}/$link)" >> ${{ github.workspace }}/CHANGELOG.md
          done
        env:
          RELEASES_URL: https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}

      # Every push to main reaches this job, but only a version bump should
      # produce a release. Without this guard the job tries to recreate an
      # existing tag and fails with "already_exists".
      - name: Check whether this version is already released 🔍
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is already released; skipping release creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is new; a release will be created."
          fi

      # Creates the release and attaches dist/* in one step. Replaces
      # actions/create-release@v1, which has been archived since 2021, and the
      # hand-rolled curl upload that followed it: that loop appended ?name= to
      # an upload_url still carrying its "{?name,label}" template suffix, so
      # the request URL was malformed and asset upload never worked.
      - name: Create Release 🚀
        if: >-
          github.ref == 'refs/heads/main' && github.event_name == 'push'
          && steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body_path: ${{ github.workspace }}/CHANGELOG.md
          draft: false
          prerelease: false
          files: dist/*
