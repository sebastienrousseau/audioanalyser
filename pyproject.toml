[tool.poetry]
name = "audioanalyser"
version = "0.0.6"
description = "Audio Analyser: Leverages the power of Microsoft Azure's advanced AI services to transform your audio data into valuable insight reports in no time through automatic speech-to-text, text analysis, and recommendations."
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]
license = "Apache Software License"
readme = "README.md"
repository = "https://github.com/sebastienrousseau/audioanalyser.github.io"
homepage = "https://audioanalyser.co"

[tool.poetry.dependencies]
aiohttp = "3.14.3"
asyncio = "3.4.3"
azure-ai-textanalytics = "5.3.0"
azure-cognitiveservices-speech = "1.35.0"
azure-common = "1.1.28"
azure-core = "1.38.0"
cherrypy = "18.9.0"
datetime = "5.4"
openai="1.109.1"
pyaudio = "0.2.14"
python = "^3.10"
python-dotenv="1.2.2"
requests = "2.33.0"

# Provider SDKs are optional: installing one backend must not pull in the
# others. openai stays a hard dependency as the default provider; ollama
# needs no SDK at all (plain HTTP).
[tool.poetry.group.anthropic]
optional = true

[tool.poetry.group.anthropic.dependencies]
anthropic = ">=0.120.0"

[tool.poetry.group.gemini]
optional = true

[tool.poetry.group.gemini.dependencies]
google-genai = ">=2.16.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 72
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 72
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
known_first_party = "audioanalyser"

# pytest reads [tool.pytest.ini_options], not [tool.pytest], and requires
# addopts to be a list in TOML. As [tool.pytest] with a string it aborted
# before collecting anything.
[tool.pytest.ini_options]
addopts = [
    "--cov=audioanalyser",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=95",
    "-m", "not integration",
]
testpaths = ["tests"]
# Integration tests hit a live Ollama server and are deselected by
# default; run them with `pytest -m integration`.
markers = [
    "integration: exercises a live external service (deselected by default)",
]

[tool.coverage.run]
source = ["audioanalyser"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    # Module entry points; running them would start a server or a recording.
    "if __name__ == .__main__.:",
]
