[flake8]
# Without this, a local .venv (poetry creates one in-tree) is linted
# and floods the output with third-party findings.
exclude = .git,__pycache__,.venv,venv,build,dist,*.egg-info

[aliases]
test = pytest

[tool:pytest]
testpaths = tests

[wheel]
universal = 1